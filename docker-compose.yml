version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: recoveriq-db
    environment:
      POSTGRES_DB: recoveriq
      POSTGRES_USER: recoveriq
      POSTGRES_PASSWORD: recoveriq_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
